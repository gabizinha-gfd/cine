<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CineNet | Streaming</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo" onclick="carregarInicio()">CineNet</div>
        <nav class="nav-links">
            <a href="#" class="nav-item active" onclick="filtrarCategoria('inicio', this, event)">Início</a>
            <a href="#" class="nav-item" onclick="filtrarCategoria('movie', this, event)">Filmes</a>
            <a href="#" class="nav-item" onclick="filtrarCategoria('tv', this, event)">Séries</a>
            <a href="#" class="nav-item" onclick="filtrarCategoria('anime', this, event)">Animes</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="section-container" id="continue-watching-section" style="display: none;">
            <h2>Continuar a Ver</h2>
            <div class="movie-row" id="continue-watching-row"></div>
        </section>

        <div id="categories-container"></div>
    </main>

    <div id="episodes-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card episodes-card">
            <button class="close-modal-btn" onclick="fecharModalEpisodios()">✕</button>
            <h2 id="modal-tv-title">Série</h2>
            
            <div class="form-group" style="margin-top: 15px;">
                <label for="season-select">Escolha a Temporada:</label>
                <select id="season-select" class="season-dropdown"></select>
            </div>

            <div id="episodes-list" class="episodes-list-container"></div>
        </div>
    </div>

    <div id="video-container" class="video-modal" style="display: none;">
        <button class="close-video-btn" onclick="fecharPlayer()">✕ Voltar</button>
        <iframe id="mega-player-iframe" src="" allowfullscreen allow="autoplay; fullscreen" frameborder="0"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
