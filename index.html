<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>CineNet</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="auth-screen" class="auth-container">
        <div class="auth-box">
            <h1 id="auth-title">Iniciar Sessão</h1>
            <p id="auth-error" class="auth-error-msg"></p>
            <form id="auth-form">
                <div class="form-group">
                    <input type="email" id="auth-email" placeholder="E-mail" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="auth-password" placeholder="Palavra-passe" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary auth-submit-btn" id="auth-submit-btn">Entrar</button>
            </form>
            <div class="auth-switch">
                <span id="auth-switch-text">Novo no CineNet?</span>
                <a href="#" id="auth-switch-link" onclick="toggleAuthMode(event)">Registe-se agora</a>
            </div>
        </div>
    </div>

    <div id="app-screen" style="display: none;">
        
        <header class="navbar">
            <div class="nav-left">
                <div class="logo" onclick="carregarInicio()">CineNet</div>
                <nav class="nav-links">
                    <a href="#" class="nav-item active" onclick="filtrarCategoria('inicio', this, event)">Início</a>
                    <a href="#" class="nav-item" onclick="filtrarCategoria('movie', this, event)">Filmes</a>
                    <a href="#" class="nav-item" onclick="filtrarCategoria('tv', this, event)">Séries</a>
                    <a href="#" class="nav-item" onclick="filtrarCategoria('anime', this, event)">Animes</a>
                    <a href="#" class="nav-item" onclick="filtrarCategoria('comedy', this, event)">Comédia</a>
                    <a href="#" class="nav-item" onclick="mostrarMinhaLista(this, event)">A minha Lista</a>
                </nav>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Pesquisar títulos..." oninput="pesquisarTitulos(event)">
                </div>
                <div class="user-profile-btn" onclick="abrirModalPerfil()" title="Configurações de Perfil">
                    <img id="user-avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="Avatar">
                    <span id="user-display-name">Perfil</span>
                </div>
            </div>
        </header>

        <section class="hero-banner" id="hero-banner">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="badge" id="hero-badge">Destaque</span>
                <h1 id="hero-title">A carregar...</h1>
                <p id="hero-desc">Descubra os melhores filmes e séries em alta definição.</p>
                <div class="hero-buttons">
                    <button class="btn-primary" id="hero-play-btn">▶ Assistir Agora</button>
                    <button class="btn-secondary" id="hero-watchlist-btn">+ A minha Lista</button>
                </div>
            </div>
        </section>

        <main class="main-content">
            <section class="section-container" id="search-results-section" style="display: none;">
                <h2 class="section-title" id="search-results-title">Resultados da Pesquisa</h2>
                <div class="movie-row" id="search-results-row"></div>
            </section>

            <section class="section-container" id="watchlist-section" style="display: none;">
                <h2 class="section-title">📌 A minha Lista</h2>
                <div class="movie-row" id="watchlist-row"></div>
            </section>

            <section class="section-container" id="continue-watching-section" style="display: none;">
                <h2 class="section-title">Continuar a Ver</h2>
                <div class="movie-row" id="continue-watching-row"></div>
            </section>

            <div id="categories-container"></div>
        </main>
    </div>

    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <button class="close-modal-btn" onclick="fecharModalPerfil()">✕</button>
            <h2>O seu Perfil</h2>
            <form id="profile-form" onsubmit="guardarPerfil(event)">
                <div class="form-group">
                    <label>Nome de Exibição</label>
                    <input type="text" id="edit-display-name" placeholder="O seu nome..." required>
                </div>
                
                <div class="form-group">
                    <label>Avatar Predefinido</label>
                    <div class="avatar-presets">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" class="preset-avatar active" onclick="selecionarPresetAvatar(this)">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=80" class="preset-avatar" onclick="selecionarPresetAvatar(this)">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80" class="preset-avatar" onclick="selecionarPresetAvatar(this)">
                        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&q=80" class="preset-avatar" onclick="selecionarPresetAvatar(this)">
                    </div>
                </div>

                <div class="form-group">
                    <label>URL de Imagem Personalizada</label>
                    <input type="url" id="edit-avatar-url" placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="fecharModalPerfil()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
                <hr class="divider">
                <button type="button" class="btn-logout" onclick="fazerLogout()">Terminar Sessão</button>
            </form>
        </div>
    </div>

    <div id="video-container" class="video-modal" style="display: none;">
        <button class="close-video-btn" onclick="fecharPlayer()" title="Sair do Player">✕ Voltar</button>
        <video id="meu-player-video" controls poster="https://via.placeholder.com/1280x720/050505/ffffff?text=A+Carregar...">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
